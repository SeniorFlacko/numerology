<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GG33 · Calendario de Energías</title>
<meta name="description" content="Calendario numerológico GG33: energía del día, zodiaco chino, números personales y tus mejores días.">
<meta name="theme-color" content="#121113">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GG33">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   DESIGN TOKENS — sistema de diseño prestado y adaptado:
   · Radix Colors (escalas dark: mauve, amber, violet, jade, ruby)
     https://www.radix-ui.com/colors — licencia MIT
   · Open Props (escalas de tamaño, radios, sombras, easings)
     https://open-props.style — licencia MIT
   Las primitivas se copian tal cual; los roles semánticos de abajo
   son los que usa la app, así que el tema se cambia en un solo lugar.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* — Radix · mauve dark (neutral) — */
  --mauve-1:#121113;--mauve-2:#1a191b;--mauve-3:#232225;--mauve-4:#2b292d;
  --mauve-5:#323035;--mauve-6:#3c393f;--mauve-7:#49474e;--mauve-8:#625f69;
  --mauve-9:#6f6d78;--mauve-10:#7c7a85;--mauve-11:#b5b2bc;--mauve-12:#eeeef0;
  /* — Radix · amber dark (primario) — */
  --amber-1:#16120c;--amber-2:#1d180f;--amber-3:#302008;--amber-4:#3f2700;
  --amber-5:#4d3000;--amber-6:#5c3d05;--amber-7:#714f19;--amber-8:#8f6424;
  --amber-9:#ffc53d;--amber-10:#ffd60a;--amber-11:#ffca16;--amber-12:#ffe7b3;
  /* — Radix · violet dark (acento) — */
  --violet-1:#14121f;--violet-2:#1b1525;--violet-3:#291f43;--violet-4:#33255b;
  --violet-5:#3c2e69;--violet-6:#473876;--violet-7:#56468b;--violet-8:#6958ad;
  --violet-9:#6e56cf;--violet-10:#7d66d9;--violet-11:#baa7ff;--violet-12:#e2ddfe;
  /* — Radix · jade dark (positivo) — */
  --jade-1:#0d1512;--jade-2:#121c18;--jade-3:#0f2e22;--jade-4:#0b3b2c;
  --jade-5:#114837;--jade-6:#1b5745;--jade-7:#246854;--jade-8:#2a7e68;
  --jade-9:#29a383;--jade-10:#27b08b;--jade-11:#1fd8a4;--jade-12:#adf0d4;
  /* — Radix · ruby dark (negativo) — */
  --ruby-1:#191113;--ruby-2:#1e1517;--ruby-3:#3a141e;--ruby-4:#4e1325;
  --ruby-5:#5e1a2e;--ruby-6:#6f2539;--ruby-7:#883447;--ruby-8:#b3445a;
  --ruby-9:#e54666;--ruby-10:#ec5a72;--ruby-11:#ff949d;--ruby-12:#fed2e1;

  /* — Open Props · escalas — */
  --size-1:.25rem;--size-2:.5rem;--size-3:1rem;--size-4:1.25rem;--size-5:1.5rem;
  --size-6:1.75rem;--size-7:2rem;--size-8:3rem;
  --size-fluid-1:clamp(.5rem,1vw,1rem);--size-fluid-2:clamp(1rem,2vw,1.5rem);
  --radius-2:.25rem;--radius-3:.5rem;--radius-4:1rem;--radius-round:1e5px;
  --ease-3:cubic-bezier(.25,0,.3,1);--ease-out-3:cubic-bezier(0,0,.3,1);
  --shadow-color:250 25% 3%;
  --shadow-2:0 3px 5px -2px hsl(var(--shadow-color)/.45),0 7px 14px -5px hsl(var(--shadow-color)/.55);
  --shadow-3:0 2px 5px -5px hsl(var(--shadow-color)/.4),0 4px 12px -5px hsl(var(--shadow-color)/.5),0 12px 15px -5px hsl(var(--shadow-color)/.6);

  /* — Roles semánticos (lo único que usa la app) — */
  --bg:var(--mauve-1);--surface:var(--mauve-2);--surface-2:var(--mauve-3);--surface-3:var(--mauve-4);
  --line:var(--mauve-6);--line-soft:var(--mauve-4);
  --text:var(--mauve-12);--text-2:var(--mauve-11);--text-3:var(--mauve-9);
  --gold:var(--amber-11);--gold-solid:var(--amber-9);--gold-bg:var(--amber-3);--gold-line:var(--amber-7);
  --accent:var(--violet-11);--accent-solid:var(--violet-9);--accent-bg:var(--violet-3);--accent-line:var(--violet-7);
  --pos:var(--jade-11);--pos-bg:var(--jade-3);--pos-line:var(--jade-7);--pos-solid:var(--jade-9);
  --neg:var(--ruby-11);--neg-bg:var(--ruby-3);--neg-line:var(--ruby-7);--neg-solid:var(--ruby-9);
  --moon:var(--amber-12);
  --font-display:'Cinzel',Georgia,serif;
  --font-body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabbar:calc(58px + env(safe-area-inset-bottom));
  --appbar:calc(52px + env(safe-area-inset-top));
}

/* ── BASE ── */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);
  min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;padding-bottom:calc(var(--tabbar) + var(--size-5))}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 12% 8%,color-mix(in srgb,var(--violet-9) 12%,transparent) 0%,transparent 52%),
             radial-gradient(ellipse at 88% 82%,color-mix(in srgb,var(--jade-9) 8%,transparent) 0%,transparent 52%),
             radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--amber-9) 8%,transparent) 0%,transparent 38%)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:var(--radius-2)}

/* ── APP BAR ── */
.appbar{position:fixed;top:0;left:0;right:0;z-index:30;height:var(--appbar);
  padding:env(safe-area-inset-top) var(--size-3) 0;display:flex;align-items:center;gap:var(--size-2);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line-soft)}
.appbar h1{font-family:var(--font-display);font-size:.95rem;font-weight:600;letter-spacing:.14em;
  background:linear-gradient(100deg,var(--amber-9),var(--amber-12) 45%,var(--violet-11));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;flex:1;min-width:0}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-round);border:1px solid var(--line);
  background:var(--surface-2);display:grid;place-items:center;font-size:.85rem;color:var(--text-2);
  transition:all .18s var(--ease-3);flex-shrink:0}
.icon-btn:hover,.icon-btn:active{border-color:var(--gold-line);color:var(--gold)}
.pill-btn{padding:.3rem .7rem;border-radius:var(--radius-round);border:1px solid var(--gold-line);
  background:var(--gold-bg);color:var(--gold);font-family:var(--font-mono);font-size:.62rem;
  letter-spacing:.08em;white-space:nowrap;transition:all .18s var(--ease-3)}
.pill-btn:hover{background:var(--amber-4)}

/* ── LAYOUT ── */
.main{position:relative;z-index:1;max-width:760px;margin:0 auto;
  padding:calc(var(--appbar) + var(--size-3)) var(--size-3) var(--size-5)}
.view{display:none;animation:in .28s var(--ease-out-3)}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:var(--size-2);display:flex;align-items:center;gap:.4rem}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius-4);
  padding:var(--size-4);margin-bottom:var(--size-3);box-shadow:var(--shadow-2)}
.card.flush{padding:var(--size-2)}
.muted{color:var(--text-3);font-size:.88rem;line-height:1.55}
.mono{font-family:var(--font-mono)}
hr.dv{border:none;border-top:1px solid var(--line-soft);margin:var(--size-3) 0}

/* ── TAB BAR ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);height:var(--tabbar);
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line-soft)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--text-3);font-family:var(--font-mono);font-size:.5rem;letter-spacing:.06em;
  text-transform:uppercase;transition:color .18s var(--ease-3);position:relative}
.tab i{font-style:normal;font-size:1.05rem;line-height:1;filter:grayscale(1) opacity(.55);transition:filter .18s}
.tab.on{color:var(--gold)}
.tab.on i{filter:none}
.tab.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:26px;height:2px;border-radius:2px;background:var(--gold-solid)}

/* ── CHIPS / PILLS ── */
.chips{display:flex;gap:var(--size-1);flex-wrap:wrap}
.chip{padding:.26rem .7rem;border-radius:var(--radius-round);font-family:var(--font-mono);
  font-size:.64rem;letter-spacing:.03em;display:inline-flex;align-items:center;gap:.32rem;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.chip.gold{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.chip.acc{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent)}
.chip.pos{background:var(--pos-bg);border-color:var(--pos-line);color:var(--pos)}
.chip.neg{background:var(--neg-bg);border-color:var(--neg-line);color:var(--neg)}

/* ── HOY ── */
.hero{position:relative;overflow:hidden;border-radius:var(--radius-4);padding:var(--size-5) var(--size-4);
  background:linear-gradient(155deg,var(--violet-2),var(--mauve-2) 55%,var(--amber-1));
  border:1px solid var(--line);margin-bottom:var(--size-3);box-shadow:var(--shadow-3)}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 82% 12%,color-mix(in srgb,var(--amber-9) 16%,transparent),transparent 45%)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--size-3);
  position:relative;z-index:1;margin-bottom:var(--size-4)}
.hero-date{font-family:var(--font-display);font-size:1.05rem;color:var(--moon);letter-spacing:.04em}
.hero-sub{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-top:.25rem}
.hero-moon{font-size:1.6rem;line-height:1}
.hero-nums{display:flex;align-items:flex-end;gap:var(--size-5);position:relative;z-index:1;flex-wrap:wrap}
.bignum{display:flex;flex-direction:column;gap:.15rem}
.bignum b{font-family:var(--font-display);font-size:3.1rem;font-weight:400;line-height:.9;color:var(--gold-solid)}
.bignum.alt b{font-size:2.2rem;color:var(--accent)}
.bignum span{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
.hero-vibe{position:relative;z-index:1;margin-top:var(--size-4);font-style:italic;font-size:1.02rem;
  line-height:1.6;color:var(--text)}
.scorebar{position:relative;z-index:1;margin-top:var(--size-4);display:flex;align-items:center;gap:var(--size-2)}
.scoretrack{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.scorefill{height:100%;border-radius:99px;transition:width .5s var(--ease-out-3)}
.scoreval{font-family:var(--font-mono);font-size:.68rem;color:var(--text-2);min-width:5.5ch;text-align:right}
.next3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--size-2)}
.n3{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-3);
  padding:var(--size-2);text-align:center;transition:all .18s var(--ease-3)}
.n3:hover{border-color:var(--gold-line)}
.n3 b{display:block;font-family:var(--font-display);font-size:1.15rem;color:var(--text)}
.n3 span{font-family:var(--font-mono);font-size:.54rem;letter-spacing:.08em;color:var(--text-3);text-transform:uppercase}

/* ── FORM / SELECTS ── */
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-family:var(--font-mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.field input,.field select{background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-3);padding:.55rem .7rem;color:var(--text);font-size:.92rem;
  outline:none;transition:border-color .18s;width:100%;min-height:44px}
.field select{appearance:none;-webkit-appearance:none;padding-right:2rem;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4.5L6 8.5L10 4.5' stroke='%23b5b2bc' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right .6rem center;background-size:12px}
.field input:focus,.field select:focus{border-color:var(--gold-line)}
.field select option{background:var(--mauve-3);color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--size-2);margin-bottom:var(--size-3)}
.form-grid .field.full{grid-column:1/-1}
@media(max-width:420px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .field.yr{grid-column:1/-1}}
.btn{padding:.65rem 1.1rem;border-radius:var(--radius-3);border:1px solid var(--gold-line);
  background:linear-gradient(135deg,var(--amber-4),var(--violet-3));color:var(--gold);
  font-family:var(--font-display);font-size:.8rem;letter-spacing:.08em;min-height:44px;
  transition:all .18s var(--ease-3)}
.btn:hover{box-shadow:0 0 18px color-mix(in srgb,var(--amber-9) 22%,transparent)}
.btn.ghost{background:none;border-color:var(--line);color:var(--text-2);font-family:var(--font-mono);font-size:.68rem}
.btn.ghost:hover{border-color:var(--gold-line);color:var(--gold);box-shadow:none}
.err{color:var(--neg);font-size:.85rem;font-style:italic;margin-top:var(--size-2)}

/* ── ONBOARDING ── */
.onb{text-align:center;padding:var(--size-6) var(--size-3)}
.onb .glyph{font-size:2.4rem;display:block;margin-bottom:var(--size-3);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.onb h2{font-family:var(--font-display);font-size:1.3rem;color:var(--moon);margin-bottom:var(--size-2);letter-spacing:.05em}
.onb p{color:var(--text-3);font-size:.95rem;line-height:1.6;max-width:34ch;margin:0 auto var(--size-5)}

/* ── CALENDARIO ── */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--size-2)}
.nav-btn{width:40px;height:40px;border-radius:var(--radius-round);background:var(--surface-2);
  border:1px solid var(--line);color:var(--text-2);font-size:1.15rem;display:grid;place-items:center;
  transition:all .18s var(--ease-3)}
.nav-btn:hover{border-color:var(--gold-line);color:var(--gold)}
#month-label{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.1em;color:var(--moon)}
.cal-tools{display:flex;gap:var(--size-1);justify-content:center;flex-wrap:wrap;margin-bottom:var(--size-2)}
.tool-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-round);
  padding:.34rem .8rem;color:var(--text-3);font-family:var(--font-mono);font-size:.62rem;
  letter-spacing:.06em;transition:all .18s var(--ease-3);min-height:32px}
.tool-btn:hover{border-color:var(--gold-line);color:var(--gold)}
.tool-btn.on{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold)}
.dheaders{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.dh{text-align:center;font-family:var(--font-mono);font-size:.52rem;letter-spacing:.12em;
  color:var(--text-3);padding:.25rem 0;text-transform:uppercase}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dc{aspect-ratio:1;border-radius:var(--radius-3);display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;position:relative;background:var(--surface-2);
  border:1px solid transparent;transition:all .15s var(--ease-3);gap:1px;min-width:0}
.dc:hover{background:var(--surface-3)}
.dc.empty{background:transparent;pointer-events:none}
.dc.master{border-color:var(--accent-line)}
.dc.master .de{color:var(--accent)}
.dc.anim-fr{box-shadow:inset 0 0 0 1px var(--pos-line)}
.dc.anim-en{box-shadow:inset 0 0 0 1px var(--neg-line)}
.dc.h2{background:linear-gradient(145deg,var(--jade-4),var(--jade-2))}
.dc.h1{background:linear-gradient(145deg,var(--jade-3),var(--jade-1))}
.dc.hm1{background:linear-gradient(145deg,var(--ruby-3),var(--ruby-1))}
.dc.hm2{background:linear-gradient(145deg,var(--ruby-4),var(--ruby-2))}
.dc.today{border-color:var(--pos-solid)}
.dc.today .dn{color:var(--pos)}
.dc.sel{border-color:var(--gold-solid);box-shadow:0 0 0 1px var(--gold-solid),0 0 14px color-mix(in srgb,var(--amber-9) 22%,transparent)}
.dc.sel .dn{color:var(--gold)}
.dn{font-family:var(--font-display);font-size:clamp(.68rem,1.8vw,.92rem);line-height:1}
.de{font-family:var(--font-mono);font-size:.42rem;color:var(--text-3);letter-spacing:.03em}
.da{font-size:.5rem;line-height:1}
.badge{position:absolute;top:2px;right:3px;font-size:.5rem;line-height:1}
.sbar{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:56%;height:2px;border-radius:2px}

/* ── MEJORES DÍAS / LISTAS ── */
.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--size-3)}
@media(max-width:600px){.bd-grid{grid-template-columns:1fr}}
.row-item{display:flex;align-items:center;gap:var(--size-2);padding:.55rem .65rem;
  border-radius:var(--radius-3);background:var(--surface-2);border:1px solid var(--line-soft);
  margin-bottom:.4rem;cursor:pointer;transition:all .18s var(--ease-3);text-align:left;width:100%}
.row-item:hover{border-color:var(--gold-line);transform:translateX(2px)}
.row-day{font-family:var(--font-display);font-size:1.2rem;min-width:2.4ch;text-align:center;line-height:1.1}
.row-good .row-day{color:var(--pos)}
.row-bad .row-day{color:var(--neg)}
.row-info{flex:1;min-width:0}
.row-meta{font-family:var(--font-mono);font-size:.54rem;color:var(--text-3);letter-spacing:.06em;margin-bottom:.1rem}
.row-why{font-size:.82rem;color:var(--text-2);line-height:1.35}
.row-score{font-family:var(--font-mono);font-size:.66rem;color:var(--text-3);flex-shrink:0}

/* ── DETALLE ── */
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:var(--size-2);
  flex-wrap:wrap;margin-bottom:var(--size-3);padding-bottom:var(--size-3);border-bottom:1px solid var(--line-soft)}
.detail-date{font-family:var(--font-display);font-size:1.05rem;color:var(--moon)}
.brow{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-family:var(--font-mono);
  font-size:.7rem;color:var(--text-3);margin-bottom:.2rem}
.brow .v{color:var(--moon)} .brow .r{color:var(--gold);font-size:.86rem}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--size-2);margin-bottom:var(--size-3)}
@media(max-width:420px){.cards3{grid-template-columns:1fr}}
.mini{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-3);padding:.8rem}

// ── NUMEROLOGY ─────────────────────────────────────────────
function dsum(n){return String(Math.abs(n)).split('').reduce((a,c)=>a+parseInt(c),0)}
function reduce(n){
  if([11,22,33].includes(n))return n;
  while(n>9){n=dsum(n);if([11,22,33].includes(n))return n}
  return n;
}
function isMaster(n){return[11,22,33].includes(n)}

function calcDay(date){
  const y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();
  const digits=[...String(y).padStart(4,'0'),...String(m).padStart(2,'0'),...String(d).padStart(2,'0')].map(Number);
  const sum=digits.reduce((a,b)=>a+b,0);
  const primary=reduce(sum);
  // Secondary = solo los dígitos del día sumados (ej: día 21 → 2+1=3, día 31 → 3+1=4)
  const dayDigits=String(d).padStart(2,'0').split('').map(Number);
  const secSum=dayDigits.reduce((a,b)=>a+b,0);
  const secondary=reduce(secSum);
  return{digits,sum,primary,secondary,secSum,dayDigits};
}

function calcLP(d,m,y){
  const digits=[...String(y).padStart(4,'0'),...String(m).padStart(2,'0'),...String(d).padStart(2,'0')].map(Number);
  const sum=digits.reduce((a,b)=>a+b,0);
  return{lp:reduce(sum),sum};
}

function dayAnim(date){
  const diff=Math.round((date-BASE)/(864e5));
  return((BASE_IDX+diff)%12+12)%12;
}

function animCompat(a,b){
  if(a===b)return'same';
  if(A_ENEMY[a]?.includes(b))return'enemy';
  if(A_FRIEND[a]?.includes(b))return'friend';
  return'neutral';
}
function numCompat(lp,num){
  const d=LP[lp]||LP[1];
  if(d.soul.includes(num))return'soul';
  if(d.enemy.includes(num))return'enemy';
  if(d.friend.includes(num))return'friend';
  return'neutral';
}

// ── FASES LUNARES (calculadas, cualquier año) ───────────────
const SYN=29.530588853*864e5;              // mes sinódico en ms
const NEW0=Date.UTC(2000,0,6,18,14,0);     // luna nueva de referencia
function lunation(date,offset){            // ¿cae el evento lunar dentro de este día local?
  const start=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime();
  const end=start+864e5;
  const k=Math.round((start-NEW0)/SYN-offset);
  for(let i=k-1;i<=k+1;i++){
    const t=NEW0+SYN*(i+offset);
    if(t>=start&&t<end)return true;
  }
  return false;
}
function isFM(d){return lunation(d,0.5)}
function isNM(d){return lunation(d,0)}
function moonAge(d){
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime();
  let a=((t-NEW0)%SYN+SYN)%SYN;
  return a/864e5;
}
const MOON_GLYPH=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
function moonGlyph(d){return MOON_GLYPH[Math.floor(moonAge(d)/29.530588853*8+0.5)%8]}

// ═══ NÚMEROS PERSONALES ════════════════════════════════════
// El AÑO PERSONAL arranca el día de tu cumpleaños y termina
// el día anterior al siguiente cumpleaños (ciclo de cumpleaños,
// no año calendario).
function d0(x){return new Date(x.getFullYear(),x.getMonth(),x.getDate())}
function fmtShort(d){return `${d.getDate()} ${MONTHS_ES[d.getMonth()].slice(0,3).toLowerCase()} ${d.getFullYear()}`}
function bdayIn(u,y){
  const last=new Date(y,u.bm,0).getDate();      // 29-feb en año no bisiesto → 28
  return new Date(y,u.bm-1,Math.min(u.bd,last));
}
function cycleStart(u,date){
  const t=d0(date),b=bdayIn(u,t.getFullYear());
  return t<b?bdayIn(u,t.getFullYear()-1):b;
}
function cycleEnd(u,date){
  const s=cycleStart(u,date);
  return new Date(bdayIn(u,s.getFullYear()+1).getTime()-864e5);
}
function personalYear(u,date){
  return reduce(dsum(u.bd)+dsum(u.bm)+dsum(cycleStart(u,date).getFullYear()));
}
function personalMonth(u,date){
  return reduce(dsum(personalYear(u,date))+dsum(date.getMonth()+1));
}
function personalDay(u,date){
  return reduce(dsum(personalMonth(u,date))+dsum(date.getDate()));
}
function cycleInfo(u,date){
  const s=cycleStart(u,date),e=cycleEnd(u,date),t=d0(date);
  const total=Math.round((e-s)/864e5)+1;
  const done=Math.round((t-s)/864e5)+1;
  return{s,e,total,done,left:total-done,pct:Math.max(0,Math.min(100,Math.round(done/total*100)))};
}

function personalPanel(date){
  const m=date.getMonth(),d=date.getDate();

  const pyd=PY_MEAN[py]||PY_MEAN[1];

// ═══ MOTOR DE PUNTUACIÓN ═══════════════════════════════════
function dayScore(date,u){
  u=u||user; if(!u)return null;
  const{primary,secondary}=calcDay(date);
  const da=dayAnim(date),ma=monthAnim(date.getMonth());
  const pd=personalDay(u,date);
  let s=0;const why=[];

  const nc=numCompat(u.lp,primary);
  if(nc==='soul'){s+=4;why.push(`el #${primary} es alma gemela de tu LP${u.lp}`)}
  else if(nc==='friend'){s+=2;why.push(`el #${primary} es amigo de tu LP${u.lp}`)}
  else if(nc==='enemy'){s-=4;why.push(`el #${primary} choca con tu LP${u.lp}`)}

  const ac=animCompat(u.anim,da);
  if(ac==='friend'){s+=3;why.push(`${ANIMALS[da]} es aliado de tu ${ANIMALS[u.anim]}`)}
  else if(ac==='enemy'){s-=3;why.push(`${ANIMALS[da]} se opone a tu ${ANIMALS[u.anim]}`)}
  else if(ac==='same'){s+=1;why.push('es día de tu propio animal')}

  const mc=animCompat(u.anim,ma);
  if(mc==='friend')s+=1;else if(mc==='enemy')s-=1;

  const sc=numCompat(u.lp,secondary);
  if(sc==='soul')s+=1;else if(sc==='enemy')s-=1;

  if(pd===u.lp){s+=2;why.push(`tu día personal ${pd} repite tu lifepath`)}
  else if(pd===9){s+=1;why.push('día personal 9: cierre y manifestación')}
  else if(pd===8){s+=1;why.push('día personal 8: dinero y decisiones')}

  if(isMaster(primary)){s+=1;why.push('número maestro en el día')}
  if(isFM(date)){s+=1;why.push('luna llena amplifica todo')}
  if(isNM(date)){s+=1;why.push('luna nueva: sembrar intención')}

  return{s,why,primary,secondary,pd,da};
}
function heatClass(s){return s>=5?'h2':s>=2?'h1':s<=-5?'hm2':s<=-2?'hm1':''}
function heatColor(s){return s>=5?'var(--pos)':s>=2?'var(--jade-8)':s<=-5?'var(--neg)':s<=-2?'var(--ruby-8)':'var(--mauve-7)'}
function scoreLabel(s){return s>=5?'excelente':s>=2?'a favor':s<=-5?'muy en contra':s<=-2?'en contra':'neutro'}
function monthScores(year,month,u){
  const out=[],t=new Date(year,month+1,0).getDate();
  for(let d=1;d<=t;d++){const r=dayScore(new Date(year,month,d),u);if(r)out.push({day:d,date:new Date(year,month,d),...r})}
  return out;
}

function intentScore(date,key,u){
  const base=dayScore(date,u); if(!base)return null;
  const P=actProfile(key);
  if(!P){                                   // catálogo viejo, por si data.json no cargó
    const I=INTENTS[key]; if(!I)return base;
    let s=base.s;const why=[];
    if(I.good.includes(base.primary)){s+=4;why.push(`#${base.primary} favorece esto`)}
    if(I.bad.includes(base.primary)){s-=4;why.push(`#${base.primary} va en contra de esto`)}
    if(I.pd.includes(base.pd)){s+=3;why.push(`tu día personal ${base.pd} es el ideal`)}
    return{...base,s,why:[...why,...base.why]};
  }
  let s=base.s;const why=[];
  const n=P.n.toLowerCase();
  if(P.good.includes(base.primary)){s+=4;why.push(`el #${base.primary} favorece ${n}`)}
  if(P.bad.includes(base.primary)){s-=4;why.push(`el #${base.primary} va en contra de ${n}`)}
  if(P.pdOk.includes(base.pd)){s+=3;why.push(`tu día personal ${base.pd} es el ideal para esto`)}
  if(P.bad.includes(base.pd)){s-=2;why.push(`tu día personal ${base.pd} no acompaña`)}
  // el peso del zodiaco depende del tipo de juego: en los de azar pesa más, en los repetidos menos
  const extra=Math.round((P.wAnim-1)*3);
  if(extra!==0){
    const f=fingerprint(date,u);
    if(f.clash){s-=extra;if(extra>0)why.push(`el choque animal pesa más en un juego de tipo "${P.g.corto.toLowerCase()}"`)}
    else if(f.trine==='friend'){s+=extra;if(extra>0)why.push('tu trine cuenta doble en este tipo de juego')}
  }
  // afinidad por etiqueta: es lo que diferencia dos actividades del mismo tipo de juego
  const TA=DATA.tagAfin||{};let tb=0;const tw=[];
  for(const t of (P.tags||[])){
    const a=TA[t];if(!a)continue;
    if(a.g.includes(base.primary)){tb+=1.2;tw.push(t)}
    if(a.b.includes(base.primary)){tb-=1.2}
    if(a.g.includes(base.pd)){tb+=0.8;if(!tw.includes(t))tw.push(t)}
    if(a.b.includes(base.pd)){tb-=0.8}
  }
  tb=Math.max(-5,Math.min(5,tb));
  // se intercala en segundo lugar para que la razón no sea siempre la misma frase
  if(Math.abs(tb)>=1)why.splice(1,0,tb>0?`encaja con el perfil de la actividad (${tw.slice(0,2).join(', ')})`
                                       :`choca con el perfil de la actividad (${P.tags.slice(0,2).join(', ')})`);
  s+=tb;
  // la sensibilidad al timing comprime o amplifica la diferencia entre días
  const k={alta:1.15,media:1,baja:.75}[P.ts]||1;
  return{...base,s:Math.round(s*k),why:[...why,...base.why]};
}
function planDays(key,days,u){
  const out=[];
  for(let i=0;i<days;i++){
    const dt=new Date(TODAY0.getFullYear(),TODAY0.getMonth(),TODAY0.getDate()+i);
    const r=intentScore(dt,key,u); if(r)out.push({date:dt,...r});
  }
  return out.sort((a,b)=>b.s-a.s||a.date-b.date);
}

// ═══ SINASTRÍA (dos perfiles) ══════════════════════════════
const NW={soul:25,friend:14,neutral:0,enemy:-20};
const AW={friend:18,same:8,neutral:0,enemy:-18};
function synastry(a,b){
  const ab=numCompat(a.lp,b.lp),ba=numCompat(b.lp,a.lp),an=animCompat(a.anim,b.anim);
  const score=Math.max(3,Math.min(99,50+NW[ab]+NW[ba]+AW[an]));
  const L={soul:'alma gemela',friend:'amigo',enemy:'enemigo',neutral:'neutral'};
  const A={friend:'aliados',same:'el mismo animal',enemy:'opuestos',neutral:'neutrales'};
  const lines=[
    ['LP → LP',`Para el LP${a.lp} de ${a.name}, el LP${b.lp} de ${b.name} es ${L[ab]}.`,ab],
    ['LP ← LP',`Para el LP${b.lp} de ${b.name}, el LP${a.lp} de ${a.name} es ${L[ba]}.`,ba],
    ['ANIMALES',`${AEMOJI[a.anim]} ${ANIMALS[a.anim]} y ${AEMOJI[b.anim]} ${ANIMALS[b.anim]} son ${A[an]}.`,
      an==='enemy'?'enemy':an==='friend'?'friend':'neutral']
  ];
  const verdict=score>=78?'Química fuerte: se amplifican.'
    :score>=60?'Buena base, con roces manejables.'
    :score>=42?'Neutral: la relación la construyen ustedes, no los números.'
    :score>=25?'Fricción real: pide traducción constante.'
    :'Choque de energías: funciona solo con reglas claras.';
  return{score,lines,verdict};
}
function sharedDays(a,b,year,month){
  const A=monthScores(year,month,a),B=monthScores(year,month,b);
  return A.map((x,i)=>({day:x.day,date:x.date,a:x.s,b:B[i].s,s:Math.min(x.s,B[i].s),
    why:[...new Set([...x.why,...B[i].why])].slice(0,2),primary:x.primary,pd:x.pd}))
    .sort((p,q)=>q.s-p.s||p.day-q.day);
}

function renderCalendar(){
  const{year,month}=cur;
  document.getElementById('month-label').textContent=`${MONTHS_ES[month]} ${year}`;
  const hb=document.getElementById('heat-btn');
  hb.classList.toggle('on',heatOn&&!!user);
  const grid=document.getElementById('days-grid');
  grid.innerHTML='';
  const first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='dc empty';grid.appendChild(e)}
  for(let d=1;d<=total;d++){
    const date=new Date(year,month,d);
    const{primary,secondary}=calcDay(date);
    const da=dayAnim(date),cell=document.createElement('div');
    cell.className='dc';
    const fm=isFM(date),nm=isNM(date),master=isMaster(primary),sc=dayScore(date);
    if(heatOn&&sc){const h=heatClass(sc.s);if(h)cell.classList.add(h)}
    if(master)cell.classList.add('master');
    if(user){const ac=animCompat(user.anim,da);
      if(ac==='friend')cell.classList.add('anim-fr');else if(ac==='enemy')cell.classList.add('anim-en')}
    if(+date===+TODAY0)cell.classList.add('today');
    if(d===sel.day&&month===sel.month&&year===sel.year)cell.classList.add('sel');
    const badge=fm?'<div class="badge">🌕</div>':nm?'<div class="badge">🌑</div>':
      master?'<div class="badge" style="color:var(--accent)">✦</div>':'';
    const bar=(heatOn&&sc&&Math.abs(sc.s)>=2)?`<div class="sbar" style="background:${heatColor(sc.s)}"></div>`:'';
    cell.innerHTML=`<div class="dn">${d}</div><div class="de">${primary}·${secondary}</div><div class="da">${AEMOJI[da]}</div>${badge}${bar}`;
    if(sc)cell.title=`${sc.s>0?'+':''}${sc.s} · ${scoreLabel(sc.s)}`;

// ═══ HUELLA DEL DÍA ════════════════════════════════════════
const SOULPAIR={0:1,1:0};   // Rata y Buey: el único par de almas gemelas del zodiaco
function fingerprint(date,u){
  u=u||user;
  const{primary,secondary}=calcDay(date);
  const da=dayAnim(date),ma=monthAnim(date.getMonth()),ya=yearAnim(date.getFullYear());
  const f={day:primary,sec:secondary,weekday:date.getDay(),
    master:isMaster(primary),
    moon:isFM(date)?'full':isNM(date)?'new':'none',
    trine:'neutral',mtrine:'neutral',ytrine:'neutral',rel:'neutral',clash:false};
  if(u){
    f.trine=animCompat(u.anim,da);
    f.mtrine=animCompat(u.anim,ma);
    f.ytrine=yearRel(u,date.getFullYear())==='soul'?'soul':animCompat(u.anim,ya);
    f.clash=(A_ENEMY[u.anim]||[]).includes(da);
    f.rel=numCompat(u.lp,primary);
    f.lp=u.lp;
    f.pd=personalDay(u,date);f.pm=personalMonth(u,date);f.py=personalYear(u,date);
  }
  return f;
}
function fpCode(f){
  const S={friend:'ami',enemy:'ene',same:'igual',neutral:'neu',soul:'alma'};
  return `D${f.day}·S${f.sec}`+(f.pd!==undefined?`·DP${f.pd}·MP${f.pm}·AP${f.py}`:'')
    +`·día:${S[f.trine]}·mes:${S[f.mtrine]}·año:${S[f.ytrine]}·lp:${S[f.rel]}`
    +(f.clash?'·CHOQUE':'')+(f.master?'·M':'')+(f.moon!=='none'?(f.moon==='full'?'·🌕':'·🌑'):'');
}
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function whenMatches(when,f){
  for(const k in when){
    const v=when[k];
    if(typeof v==='boolean'){if(f[k]!==v)return false;continue}
    if(f[k]===undefined)return false;
    if(!v.includes(f[k]))return false;
  }
  return true;
}
const FAM_LBL={day:'energía del día',pd:'día personal',pm:'mes personal',py:'año personal',
  trine:'animal del día',mtrine:'animal del mes',ytrine:'animal del año',clash:'choque animal',
  rel:'tu lifepath',moon:'luna',master:'nº maestro',combo:'combinación',sec:'secundario'};

function pickActions(date,type,n,u){
  u=u||user;
  if(!DATA||!DATA.acciones)return null;
  const f=fingerprint(date,u);
  const seed=`${date.getFullYear()}-${date.getMonth()}-${date.getDate()}|${u?`${u.by}${u.bm}${u.bd}`:'x'}`;
  const cands=DATA.acciones
    .filter(a=>a.t===type&&whenMatches(a.when,f))
    .map(a=>({...a,sc:a.w+Object.keys(a.when).length*2+(hash32(seed+a.id)%1000)/1000}))
    .sort((a,b)=>b.sc-a.sc);
  const out=[],fams=new Set();
  for(const c of cands){if(out.length>=n)break;if(fams.has(c.f))continue;fams.add(c.f);out.push(c)}
  for(const c of cands){if(out.length>=n)break;if(!out.includes(c))out.push(c)}
  return out;
}
function actionList(date,type,cls,u){
  const picked=pickActions(date,type,3,u);
  if(!picked||!picked.length){
    const g=GUIDE[calcDay(date).primary]||GUIDE[1];
    return (type==='do'?g.do:g.dont).map(i=>`<li>${i}</li>`).join('');
  }
  return picked.map(a=>`<li>${a.txt}<span class="src">${FAM_LBL[a.f]||a.f}</span></li>`).join('');
}

// ═══ RADAR DEL AÑO CHINO ═══════════════════════════════════
function yearRel(u,y){
  const ya=yearAnim(y);
  if(ya===u.anim)return'propio';
  if((A_ENEMY[u.anim]||[]).includes(ya))return'enemigo';
  if(SOULPAIR[u.anim]===ya)return'soul';
  if((A_FRIEND[u.anim]||[]).includes(ya))return'trine';
  return'neutral';
}
function cnyDate(y){
  const t=DATA&&DATA.anio&&DATA.anio.cny&&DATA.anio.cny[String(y)];
  if(!t)return null;
  const[m,d]=t.split('-').map(Number);
  return new Date(y,m-1,d);
}
function cnyLabel(y){
  const d=cnyDate(y);
  return d?`${d.getDate()} ${MONTHS_ES[d.getMonth()].slice(0,3).toLowerCase()}`:'~feb';
}
function nextYearOf(u,rel,from){
  for(let i=0;i<13;i++){const y=from+i;if(yearRel(u,y)===rel)return y}
  return null;
}
function faltan(y){
  const start=cnyDate(y)||new Date(y,1,4);
  const ms=start-TODAY0;
  if(ms<=0)return null;
  const dias=Math.round(ms/864e5);
  const a=Math.floor(dias/365),m=Math.round((dias%365)/30.4);
  if(a<=0)return `${dias} días`;
  return `${a} año${a>1?'s':''}${m?` y ${m} mes${m>1?'es':''}`:''}`;
}
const REL_CLS={soul:'pos',trine:'pos',propio:'acc',enemigo:'neg',neutral:''};
const REL_ICON={soul:'◈',trine:'✦',propio:'◎',enemigo:'✕',neutral:'·'};

function renderAnio(){
  const el=document.getElementById('anio-body');
  if(!user){el.innerHTML=onboardingHtml();return}
  if(!DATA||!DATA.anio){el.innerHTML='<div class="card"><p class="muted">Cargando la base de datos…</p></div>';return}
  const Y=today.getFullYear(),rel=yearRel(user,Y),E=DATA.anio.estados[rel];
  const ya=yearAnim(Y);
  const enemyYear=nextYearOf(user,'enemigo',rel==='enemigo'?Y+1:Y);
  const ownYear=nextYearOf(user,'propio',rel==='propio'?Y+1:Y);
  const trineYear=nextYearOf(user,'trine',Y);
  const f=faltan(enemyYear);
  const avisoKey=rel==='enemigo'?'dentro':!f?'lejos':(enemyYear-Y<=1?'cerca':(enemyYear-Y<=4?'medio':'lejos'));
  const enemyAnim=A_ENEMY[user.anim][0];

  const rows=[];
  for(let i=0;i<12;i++){
    const y=Y+i,r=yearRel(user,y),a=yearAnim(y);
    rows.push(`<div class="yr-row ${r==='enemigo'?'bad':r==='trine'||r==='soul'?'good':''}${y===Y?' now':''}">
      <div class="yr-y">${y}</div>
      <div class="yr-a">${AEMOJI[a]} ${ANIMALS[a]}</div>
      <div class="yr-c">${cnyLabel(y)}</div>
      <div class="chip ${REL_CLS[r]}" style="font-size:.54rem">${REL_ICON[r]} ${DATA.anio.estados[r].label}</div>
    </div>`);
  }
  el.innerHTML=`
  <div class="card yr-hero ${REL_CLS[rel]||''}">
    <div class="eyebrow">${REL_ICON[rel]} ${E.label} · ${Y}</div>
    <div class="yr-big">${AEMOJI[ya]}<div><div class="yr-title">${E.titulo}</div>
      <div class="prof-meta">Tú eres ${AEMOJI[user.anim]} ${ANIMALS[user.anim]} · ${Y} es año del ${ANIMALS[ya]}${cnyDate(Y)?` (arrancó el ${cnyLabel(Y)})`:''}</div></div></div>
    <p class="gplain" style="margin-top:var(--size-3)">${E.texto}</p>
    <div class="do-dont" style="margin-top:var(--size-4)">
      <div><div class="glabel" style="color:var(--pos)">✦ ESTE AÑO SÍ</div>
        <ul class="dolist">${E.do.map(i=>`<li>${i}</li>`).join('')}</ul></div>
      <div><div class="glabel" style="color:var(--neg)">✕ ESTE AÑO NO</div>
        <ul class="dontlist">${E.dont.map(i=>`<li>${i}</li>`).join('')}</ul></div>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">⏳ Cuenta regresiva</div>
    <div class="cd-grid">
      <div class="cd ${rel==='enemigo'?'bad':''}">
        <div class="cd-lbl">Tu año enemigo · ${AEMOJI[enemyAnim]} ${ANIMALS[enemyAnim]}</div>
        <div class="cd-val">${rel==='enemigo'?'ESTÁS DENTRO':enemyYear}</div>
        <div class="cd-sub">${rel==='enemigo'?`termina con el año nuevo chino de ${Y+1} (${cnyLabel(Y+1)})`:`empieza el ${cnyLabel(enemyYear)} · faltan ${f}`}</div>
      </div>
      <div class="cd">
        <div class="cd-lbl">Tu propio año · ${AEMOJI[user.anim]} ${ANIMALS[user.anim]}</div>
        <div class="cd-val">${rel==='propio'?'ESTÁS DENTRO':ownYear}</div>
        <div class="cd-sub">${rel==='propio'?'año espejo en curso':`en ${faltan(ownYear)||'—'}`}</div>
      </div>
      <div class="cd good">
        <div class="cd-lbl">Próximo año de trine</div>
        <div class="cd-val">${trineYear||'—'}</div>
        <div class="cd-sub">${trineYear===Y?'es este año, aprovéchalo':trineYear?`${AEMOJI[yearAnim(trineYear)]} ${ANIMALS[yearAnim(trineYear)]} · en ${faltan(trineYear)||'—'}`:'—'}</div>
      </div>
    </div>
    <div class="plan-note" style="margin-top:var(--size-3)">${DATA.anio.aviso[avisoKey]}</div>
  </div>

  <div class="card">
    <div class="eyebrow">◈ Tu ciclo de 12 años</div>
    <div class="yr-table">${rows.join('')}</div>
    <p class="credit" style="text-align:left;margin-top:var(--size-3)">EL AÑO CHINO ARRANCA CON EL AÑO NUEVO CHINO, NO EL 1 DE ENERO. SI NACISTE ENTRE ENERO Y MEDIADOS DE FEBRERO, TU ANIMAL PUEDE SER EL DEL AÑO ANTERIOR.</p>
  </div>`;
}
function anioAlertHtml(){
  if(!user||!DATA||!DATA.anio)return '';
  const Y=today.getFullYear(),rel=yearRel(user,Y);
  if(rel!=='enemigo'&&rel!=='propio'&&rel!=='soul')return '';
  const E=DATA.anio.estados[rel];
  return `<button class="card alert ${REL_CLS[rel]}" onclick="go('anio')" style="width:100%;text-align:left">
    <div class="eyebrow" style="color:inherit">${REL_ICON[rel]} ${E.label} · ${Y}</div>
    <div class="alert-t">${E.titulo}</div>
    <div class="muted" style="margin-top:.25rem">${E.do[0]} →</div>
  </button>`;
}

// ═══ ORQUESTADOR ═══════════════════════════════════════════
function renderAll(){
  if(tab==='hoy')renderHoy();
  if(tab==='cal'){renderCalendar();renderBest();renderDetail()}
  if(tab==='anio')renderAnio();
  if(tab==='plan')renderPlan();
  if(tab==='perfil')renderProfiles();
  document.getElementById('who-btn').textContent=user?user.name.trim()[0].toUpperCase():'✦';
}

// ═══ PWA ═══════════════════════════════════════════════════
let deferredPrompt=null;
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  document.getElementById('install-btn').hidden=false;
  updatePwaStatus();
});
window.addEventListener('appinstalled',()=>{
  deferredPrompt=null;document.getElementById('install-btn').hidden=true;
  toast('App instalada ✦');updatePwaStatus();
});
async function doInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;document.getElementById('install-btn').hidden=true;
}
function updatePwaStatus(){
  const el=document.getElementById('pwa-status');if(!el)return;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  el.innerHTML=standalone
    ?'Estás usando la app instalada. Funciona sin internet: los datos viven en este dispositivo.'
    :deferredPrompt
      ?'Puedes instalarla como app con el botón ⤓ de arriba. Se abre a pantalla completa y funciona sin internet.'
      :ios
        ?'Para instalarla en iPhone: botón <b>Compartir</b> → <b>Añadir a pantalla de inicio</b>.'
        :'Añádela a tu pantalla de inicio desde el menú del navegador para usarla como app.';
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ═══ INIT ══════════════════════════════════════════════════
loadStore();syncUser();
go('hoy');
loadData().then(ok=>{if(ok)renderAll()});
updatePwaStatus();
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(tab==='cal'&&e.key==='ArrowLeft')changeMonth(-1);
  if(tab==='cal'&&e.key==='ArrowRight')changeMonth(1);
  if(e.key==='t'||e.key==='T'){goToday();go('hoy')}
});
</script>
